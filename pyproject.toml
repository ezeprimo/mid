[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mid"
version = "0.1.0"
description = "CLI document to Markdown converter using Microsoft MarkItDown"
requires-python = ">=3.10"
dependencies = [
    "markitdown>=0.1.0",
]

[project.scripts]
mid = "mid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

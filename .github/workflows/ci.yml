name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install Ruff
        run: python -m pip install ruff==0.9.0
      - name: Ruff check
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-
      - name: Install project and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "markitdown[all]"
          python -m pip install pytest==8.3.0 python-docx openpyxl

      - name: Run test suite
        run: python -m pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install build
        run: python -m pip install build==1.2.2.post1
      - name: Build package
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-packages-ci-${{ github.sha }}
          path: dist/
      - name: List build artifacts
        run: ls -la dist/

  linux-binary:
    # Guards the release build path: release.yml only runs on tags, so without
    # this job a broken build script or a too-new glibc requirement would only
    # surface while cutting a release (issue #57).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux binary (manylinux_2_28, glibc >= 2.28)
        shell: bash
        run: bash ./scripts/build-linux-manylinux.sh --clean --output-dir dist
      - name: Smoke the binary on an older glibc image
        shell: bash
        run: |
          version_out="$(docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:20.04 /dist/mid-linux-amd64 --version)"
          echo "$version_out"
          if ! echo "$version_out" | grep -q "mid"; then
            echo "ERROR: the Linux binary does not start on ubuntu:20.04 (glibc 2.31)"
            exit 1
          fi

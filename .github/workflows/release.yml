name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tag format
        shell: python
        run: |
          import re, sys
          ref = "${{ github.ref }}"
          if not ref.startswith("refs/tags/v"):
            # workflow_dispatch on non-tag — skip validation
            print("Not a tag push, skipping validation")
            sys.exit(0)
          tag = ref.removeprefix("refs/tags/")
          if not re.match(r"^v\d+\.\d+\.\d+$", tag):
            print(f"ERROR: tag '{tag}' does not match semver pattern vX.Y.Z")
            sys.exit(1)
          print(f"Tag '{tag}' validated successfully")

  build-binaries:
    name: build-${{ matrix.target }}
    needs: [validate-tag]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
            artifact_name: mid-windows-amd64.exe
          - os: ubuntu-latest
            target: linux-amd64
            artifact_name: mid-linux-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\pip\Cache' || '~/.cache/pip' }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install --upgrade pip 'pyinstaller==6.11.0' build 'markitdown[all]'

      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -Clean -Version "${{ github.ref_name }}" -OutputDir dist

      - name: Build Linux binary (manylinux_2_28, glibc >= 2.28)
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/build-linux-manylinux.sh --clean --version "${{ github.ref_name }}" --output-dir dist

      - name: Smoke check --version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $versionOut = & ".\dist\mid-windows-amd64.exe" --version
          if ($versionOut -notmatch "mid") {
            throw "version output did not include expected marker"
          }

      - name: Smoke check --version (Linux, glibc floor image)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Run the binary on an older image than both the build container and
          # ubuntu-latest, otherwise a too-new glibc requirement cannot be caught.
          version_out="$(docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:20.04 /dist/mid-linux-amd64 --version)"
          if ! echo "$version_out" | grep -q "mid"; then
            echo "ERROR: version output did not include expected marker"
            exit 1
          fi

      - name: Generate smoke .docx (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/release/make_smoke_docx.py --output "$env:RUNNER_TEMP/workflow-smoke.docx"

      - name: Generate smoke .docx (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: python scripts/release/make_smoke_docx.py --output "$RUNNER_TEMP/workflow-smoke.docx"

      - name: Smoke conversion (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $docx = Join-Path $env:RUNNER_TEMP "workflow-smoke.docx"
          $md = Join-Path $env:RUNNER_TEMP "workflow-smoke.md"
          & ".\dist\mid-windows-amd64.exe" convert $docx -o $md
          if (-not (Test-Path $md)) {
            throw "Expected smoke markdown output file"
          }
          $text = Get-Content -Raw $md
          if ($text -notmatch "workflow smoke conversion") {
            throw "Converted markdown missing expected content"
          }

      - name: Smoke conversion (Linux, glibc floor image)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          DOCX="$RUNNER_TEMP/workflow-smoke.docx"
          MD="$RUNNER_TEMP/workflow-smoke.md"
          # Convert on the documented glibc floor image (rockylinux:8, glibc
          # 2.28): --version exits before the converter imports markitdown/
          # magika/onnxruntime, which are what pin the artifact's glibc floor.
          docker run --rm \
            -v "$RUNNER_TEMP:/smoke:rw" \
            -v "$PWD/dist:/dist:ro" \
            rockylinux:8 \
            /dist/mid-linux-amd64 convert /smoke/workflow-smoke.docx -o /smoke/workflow-smoke.md
          test -f "$MD"
          grep -q "workflow smoke conversion" "$MD"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/${{ matrix.artifact_name }}

  build-python:
    needs: [validate-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: |
            dist/*.whl
            dist/*.tar.gz

  prepare-release:
    runs-on: ubuntu-latest
    needs: [build-binaries, build-python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: binary-windows-amd64
          path: release-artifacts

      - name: Download linux binary artifact
        uses: actions/download-artifact@v4
        with:
          name: binary-linux-amd64
          path: release-artifacts

      - name: Download python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: release-artifacts

      - name: Generate checksums.txt
        shell: bash
        run: |
          cd release-artifacts
          sha256sum * > checksums.txt

      - name: Render release notes
        run: |
          python scripts/release/render_release_notes.py \
            --version "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --output release-artifacts/release-notes.md

      - name: Validate release contract
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path("release-artifacts")
          assets = [{"name": p.name} for p in sorted(root.glob("*")) if p.is_file() and p.name != "release.json" and p.name != "releases.json"]
          payload = {
            "tag_name": "${{ github.ref_name }}",
            "draft": False,
            "prerelease": False,
            "assets": assets,
            "checksums_content": (root / "checksums.txt").read_text(encoding="utf-8"),
            "body": (root / "release-notes.md").read_text(encoding="utf-8"),
          }

          (root / "release.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
          (root / "releases.json").write_text(json.dumps([payload], indent=2), encoding="utf-8")

      - name: Run validator script
        run: |
          python scripts/release/validate_release.py \
            --release-json release-artifacts/release.json \
            --requested-tag "${{ github.ref_name }}" \
            --releases-json release-artifacts/releases.json

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release-artifacts

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [prepare-release]
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-artifacts/release-notes.md
          files: |
            release-artifacts/mid-windows-amd64.exe
            release-artifacts/mid-linux-amd64
            release-artifacts/*.whl
            release-artifacts/*.tar.gz
            release-artifacts/checksums.txt
